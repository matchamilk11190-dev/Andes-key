<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Raw Script Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-indigo-400">Roblox Raw Script Generator</h1>
            <p class="text-sm text-slate-400">Chọn file script, xem mã nguồn raw và copy nhanh.</p>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-5">
            <!-- Chọn file -->
            <div>
                <label class="block text-sm font-semibold mb-2">1. Chọn file script (.lua, .txt)</label>
                <input type="file" id="fileInput" accept=".lua,.txt" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer transition">
            </div>

            <!-- Đặt tên file / định danh -->
            <div>
                <label class="block text-sm font-semibold mb-2">2. Tên file / Đường dẫn hiển thị</label>
                <input type="text" id="scriptName" placeholder="vd: autoserialize.lua" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <!-- Khung Raw + Nút Copy -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold">3. Nội dung Raw Code</label>
                    <button id="copyBtn" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 shadow-sm">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy Raw
                    </button>
                </div>
                <textarea id="rawOutput" readonly rows="12" placeholder="Nội dung file sẽ hiển thị ở đây..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 font-mono text-xs text-emerald-400 focus:outline-none resize-y leading-relaxed"></textarea>
            </div>

            <!-- Gợi ý Loadstring (cho Roblox) -->
            <div class="pt-4 border-t border-slate-700/80 space-y-2">
                <label class="block text-xs font-semibold text-indigo-300">Loadstring mẫu (Dùng khi đưa link raw lên GitHub/Host):</label>
                <div class="flex gap-2">
                    <input type="text" id="loadstringOutput" readonly value='loadstring(game:HttpGet("https://raw.githubusercontent.com/user/repo/main/script.lua"))()' class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 font-mono text-xs text-slate-400">
                    <button id="copyLsBtn" class="bg-slate-700 hover:bg-slate-600 text-xs px-3.5 py-2 rounded-xl font-medium transition">Copy LS</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const scriptName = document.getElementById('scriptName');
        const rawOutput = document.getElementById('rawOutput');
        const copyBtn = document.getElementById('copyBtn');
        const copyLsBtn = document.getElementById('copyLsBtn');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            scriptName.value = file.name;
            const reader = new FileReader();
            reader.onload = (evt) => {
                rawOutput.value = evt.target.result;
            };
            reader.readAsText(file);
        });

        copyBtn.addEventListener('click', () => {
            if (!rawOutput.value.trim()) return;
            navigator.clipboard.writeText(rawOutput.value);
            const orig = copyBtn.innerHTML;
            copyBtn.innerHTML = 'Đã copy!';
            copyBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
            setTimeout(() => {
                copyBtn.innerHTML = orig;
                copyBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
            }, 2000);
        });

        copyLsBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('loadstringOutput').value);
            alert('Đã copy loadstring!');
        });
    </script>
</body>
</html>
